# This rule is not used by the project agentrewind itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the agentrewind.agentrewind.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentrewind
    app.kubernetes.io/managed-by: kustomize
  name: agentrewindconfig-editor-role
rules:
- apiGroups:
  - agentrewind.agentrewind.io
  resources:
  - agentrewindconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agentrewind.agentrewind.io
  resources:
  - agentrewindconfigs/status
  verbs:
  - get
