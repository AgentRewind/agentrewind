apiVersion: v1
kind: Pod
metadata:
  name: demo-agent
  namespace: agentrewind
  labels:
    app: demo-agent
    agentrewind.io/enabled: "true"
spec:
  restartPolicy: OnFailure
  containers:
    - name: agent
      image: agentrewind/demo-agent:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4318"
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: agentrewind-db-app
              key: uri
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: USE_REAL_LLM
          value: "false"
      volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
  volumes:
    - name: podinfo
      downwardAPI:
        items:
          - path: annotations
            fieldRef:
              fieldPath: metadata.annotations
